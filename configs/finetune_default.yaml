# Fine-tuning config for supervised DR grading (SSiT fine-tuning, DRC-49).
# The dataset must already be prepared by utils/crop.py as an ImageFolder
# tree: <finetune_dataset_root>/{train,val,test}/{0,1,2,3,4}/.

# Architecture: standard ViT-B/16 per Dosovitskiy et al. (2020)
patch_size: 16
embed_dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4.0
drop_rate: 0.0
attn_drop_rate: 0.0

pretrained_weights: null
num_classes: 5

data_dir: ../data
image_size: [224, 224]
num_workers: 4
pin_memory: true
train_split: 0.8
val_split: 0.1

# Fine-tuning data (APTOS 2019 by default; swap root and mean/std for
# Messidor-2 or DDR). Stats from SSiT funcs.py.
finetune_dataset_root: data/aptos2019
finetune_input_size: 384
finetune_mean: [0.46100369095802307, 0.246780663728714, 0.07989078760147095]
finetune_std: [0.24873991310596466, 0.13842609524726868, 0.08025242388248444]

# Fine-tuning hyper-parameters (tuned for APTOS 2019; SSiT defaults live in
# Settings for research runs).
finetune_lr: 3.0e-4
finetune_min_lr: 0.0
finetune_weight_decay: 0.05
finetune_warmup_epochs: 5
finetune_epochs: 50
finetune_checkpoint: null

batch_size: 32
learning_rate: 1e-05
max_epochs: 50
gradient_clip_val: 1.0
accumulate_grad_batches: 1
precision: 16-mixed

host: 0.0.0.0
port: 8000
workers: 1
max_batch_size: 16
