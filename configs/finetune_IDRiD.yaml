# Fine-tuning config for supervised DR grading on DDR (DRC-49).
# Shared settings are loaded from finetune_base.yaml.
_base_: finetune_base.yaml
# The dataset must already be staged as an ImageFolder tree
# <finetune_dataset_root>/{train,valid,test}/{0,1,2,3,4}/ (see the
# prepare-ddr tool in the preprocess-retina-datasets repo). Use
# prepare-ddr --copy when the prepared tree will be transferred to another
# machine; this keeps the ImageFolder independent of source symlinks.
# Root points at the prepared DDR ImageFolder tree in the shared datasets
# directory.
#
# Only keys the fine-tuning path actually reads are listed here; the
# pretraining-only keys (image_size, learning_rate, max_epochs, ...) live in
# the pretrain configs. finetune_checkpoint is resolved relative to the
# working directory (checkpoints/ = /app/checkpoints inside the container).

# Fine-tuning data (DDR by default; swap root and mean/std for APTOS-2019
# or Messidor-2). DDR stats from SSiT funcs.py via dr_model.data.constants.
finetune_dataset_root: ../datasets/IDRiD-ImageFolder-cropped
finetune_input_size: 384
finetune_checkpoint: checkpoints/finetune/SquaredCDFLoss/DDR/DEV_SPLIT_epoch_13.pt
finetune_mean: [0.543465, 0.264543, 0.087818]
finetune_std: [0.25007, 0.143724, 0.086933]

mlflow_experiment_name: dr-finetune-IDRiD
