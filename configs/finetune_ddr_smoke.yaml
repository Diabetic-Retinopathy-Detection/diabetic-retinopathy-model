# Fine-tuning smoke config (DDR) — single epoch through the DDP path.
# Same data as finetune_ddr.yaml; used to prove the pipeline (checkpoint
# load, DDP sync, logging) works before a full run.

# Architecture: standard ViT-B/16 per Dosovitskiy et al. (2020)
patch_size: 16
embed_dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4.0
drop_rate: 0.0
attn_drop_rate: 0.0
num_classes: 5

# Training
batch_size: 32
num_workers: 4
pin_memory: true
gradient_clip_val: 1.0
precision: 16-mixed

finetune_dataset_root: data/ddr
finetune_input_size: 384
finetune_mean: [0.423737496137619, 0.2609460651874542, 0.128403902053833]
finetune_std: [0.29482534527778625, 0.20167365670204163, 0.13668020069599152]

finetune_lr: 3.0e-4
finetune_min_lr: 0.0
finetune_weight_decay: 0.05
finetune_warmup_epochs: 1
finetune_epochs: 1
finetune_checkpoint: checkpoints/full-pretraining/checkpoint.pt

# Serving (shared Settings, read by dr-serve)
host: 0.0.0.0
port: 8000
workers: 1
