site_name: diabetic-retinopathy-model
repo_url: https://github.com/Diabetic-Retinopathy-Detection/diabetic-retinopathy-model
site_url: https://diabetic-retinopathy-detection.github.io/diabetic-retinopathy-model
site_description: ViT-based model for diabetic retinopathy classification — training, inference, and serving.
site_author: Stefan Meier
edit_uri: edit/main/docs/
repo_name: Diabetic-Retinopathy-Detection/diabetic-retinopathy-model
copyright: Maintained by <a href="https://Meier-Stefan.com">Meier-Stefan</a>.

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Experiment Tracking: experiment-tracking.md
  - HPC Deployment: hpc.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Diabetic-Retinopathy-Detection/diabetic-retinopathy-model
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/diabetic-retinopathy-model

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
